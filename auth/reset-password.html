<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New password - SOGED</title>
    <link rel="icon" type="image/png" href="../Multimedia/Images/Soged/Newturttle.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { min-height: 100vh; background: #1E2B37; display: flex; align-items: center; justify-content: center; }
        .card-box { background: #fff; border-radius: 20px; padding: 2.5rem; max-width: 440px; width: 100%; }
        .btn-soged { background: #C0392B; color: #fff; border: 0; width: 100%; padding: 0.9rem; border-radius: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card-box">
        <h2 class="mb-2">Choose a new password</h2>
        <p class="text-muted">Must be at least 8 characters and include a letter and a number.</p>
        <form id="resetForm">
            <label class="form-label" for="password">New password</label>
            <input type="password" id="password" class="form-control mb-3" required minlength="8">
            <label class="form-label" for="confirm">Confirm password</label>
            <input type="password" id="confirm" class="form-control mb-3" required minlength="8">
            <button type="submit" class="btn-soged" id="saveBtn">Update password</button>
        </form>
        <p class="mt-3 mb-0"><a href="login.html">Back to sign in</a></p>
        <div id="alert" class="alert mt-3" hidden></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script>
        const alertBox = document.getElementById('alert');
        function show(msg, type) {
            alertBox.hidden = false;
            alertBox.className = 'alert mt-3 alert-' + (type === 'success' ? 'success' : 'danger');
            alertBox.textContent = msg;
        }
        function validatePassword(password) {
            if (password.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
            if (!/[A-Za-z]/.test(password) || !/\d/.test(password)) {
                return 'La contraseña debe incluir al menos una letra y un número.';
            }
            return null;
        }
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            if (password !== confirm) {
                show('Las contraseñas no coinciden.', 'error');
                return;
            }
            const invalid = validatePassword(password);
            if (invalid) {
                show(invalid, 'error');
                return;
            }
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            try {
                const { data: sessionData } = await supabaseClient.auth.getSession();
                if (!sessionData?.session) {
                    show('El enlace no es válido o expiró. Solicita uno nuevo.', 'error');
                    btn.disabled = false;
                    return;
                }
                const { error } = await supabaseClient.auth.updateUser({ password });
                if (error) {
                    if (/expired/i.test(error.message)) show('El enlace expiró. Solicita uno nuevo.', 'error');
                    else if (/same password|should be different/i.test(error.message)) {
                        show('La nueva contraseña debe ser distinta a la anterior.', 'error');
                    } else show(error.message, 'error');
                    btn.disabled = false;
                    return;
                }
                show('Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } catch (err) {
                show(err.message, 'error');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
