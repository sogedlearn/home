<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - SOGED</title>
    <link rel="icon" type="image/png" href="../Multimedia/Images/Soged/Newturttle.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { min-height: 100vh; background: #1E2B37; display: flex; align-items: center; justify-content: center; }
        .card-box { background: #fff; border-radius: 20px; padding: 2.5rem; max-width: 440px; width: 100%; }
        .btn-soged { background: #C0392B; color: #fff; border: 0; width: 100%; padding: 0.9rem; border-radius: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card-box">
        <h2 class="mb-2">Reset password</h2>
        <p class="text-muted">Enter your email and we will send a recovery link. The link expires after a short time.</p>
        <form id="forgotForm">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-control mb-3" required placeholder="you@email.com">
            <button type="submit" class="btn-soged" id="sendBtn">Send reset link</button>
        </form>
        <p class="mt-3 mb-0"><a href="login.html">Back to sign in</a></p>
        <div id="alert" class="alert mt-3" hidden></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script>
        const alertBox = document.getElementById('alert');
        function show(msg, type) {
            alertBox.hidden = false;
            alertBox.className = 'alert mt-3 alert-' + (type === 'success' ? 'success' : 'danger');
            alertBox.textContent = msg;
        }
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            try {
                const redirectTo = window.location.origin + '/auth/reset-password.html';
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
                if (error) {
                    if (/expired/i.test(error.message)) show('El enlace expiró. Solicita uno nuevo.', 'error');
                    else show(error.message, 'error');
                    btn.disabled = false;
                    return;
                }
                show('Si el correo existe, recibirás un enlace para restablecer tu contraseña.', 'success');
            } catch (err) {
                show(err.message, 'error');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
